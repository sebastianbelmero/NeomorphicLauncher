# Project-wide Gradle settings — Pengaturan Gradle tingkat proyek
# For more details, see https://developer.android.com/build

# JVM args untuk Gradle daemon — JVM arguments for Gradle daemon
org.gradle.jvmargs=-Xmx3g -XX:MaxMetaspaceSize=512m -Dfile.encoding=UTF-8 -XX:+HeapDumpOnOutOfMemoryError

# Nonaktifkan paralel build (lebih stabil untuk first build)
org.gradle.parallel=false

# Nonaktifkan configure on demand
org.gradle.configureondemand=false

# AndroidX — Wajib untuk library modern
android.useAndroidX=true

# Nonaktifkan Kotlin Code Style agar tidak konflik
kotlin.code.style=official

# Non-Transitive R class — R class per modul (lebih cepat build)
android.nonTransitiveRClass=true

# Caching
org.gradle.caching=true
