plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
}

android {
    namespace 'com.neumorphic.launcher'
    compileSdk 34

    defaultConfig {
        // Package name BERBEDA dari v1 agar bisa install side-by-side
        // Different package name from v1 to allow side-by-side installation
        applicationId "com.neumorphic.launcher.pro"
        minSdk 26          // Android 8.0 (Oreo)
        targetSdk 34       // Android 14
        versionCode 2
        versionName "2.0.0-pro"

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        vectorDrawables {
            useSupportLibrary true
        }

        // Optimasi untuk Oppo A6 Pro — MediaTek Helio G99, arm64-v8a
        ndk {
            abiFilters 'arm64-v8a', 'armeabi-v7a'
        }

        resourceConfigurations += ['en', 'id']
    }

    buildTypes {
        release {
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
        debug {
            debuggable true
            applicationIdSuffix ".debug"
            versionNameSuffix "-debug"
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    kotlinOptions {
        jvmTarget = '17'
    }

    buildFeatures {
        viewBinding true
        // Build config untuk feature flags
        buildConfig true
    }

    packaging {
        resources {
            excludes += '/META-INF/{AL2.0,LGPL2.1}'
        }
    }
}

dependencies {
    // Core AndroidX
    implementation 'androidx.core:core-ktx:1.12.0'
    implementation 'androidx.appcompat:appcompat:1.6.1'
    implementation 'androidx.activity:activity-ktx:1.8.0'
    implementation 'androidx.fragment:fragment-ktx:1.6.1'
    implementation 'androidx.lifecycle:lifecycle-runtime-ktx:2.6.2'
    implementation 'androidx.lifecycle:lifecycle-viewmodel-ktx:2.6.2'

    // Material Components — Material Design 3
    implementation 'com.google.android.material:material:1.11.0'

    // RecyclerView + ViewPager2
    implementation 'androidx.recyclerview:recyclerview:1.3.2'
    implementation 'androidx.viewpager2:viewpager2:1.0.0'

    // Layout
    implementation 'androidx.constraintlayout:constraintlayout:2.1.4'

    // Coroutines
    implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-android:1.7.3'

    // SharedPreferences / DataStore
    implementation 'androidx.preference:preference-ktx:1.2.1'

    // Biometric for app lock (fingerprint)
    implementation 'androidx.biometric:biometric:1.1.0'

    // WorkManager for smart suggestions background work
    implementation 'androidx.work:work-runtime-ktx:2.8.1'

    // Gson for serialization (icon pack, smart folder config)
    implementation 'com.google.code.gson:gson:2.10.1'

    // Testing
    testImplementation 'junit:junit:4.13.2'
    androidTestImplementation 'androidx.test.ext:junit:1.1.5'
    androidTestImplementation 'androidx.test.espresso:espresso-core:3.5.1'
}
